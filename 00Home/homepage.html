<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="description" content="スマホですぐ遊べるブラウザゲームを集めたサイトです。">
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#13120f" media="(prefers-color-scheme: dark)">
        <title>TEMのゲームサイト</title>

        <!-- ホーム画面に追加（PWA） -->
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="TEMゲーム">

        <!-- 保存済みテーマを描画前に適用（ちらつき防止） -->
        <script>
            (function () {
                try {
                    var t = JSON.parse(localStorage.getItem("gs:theme"));
                    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/tokens.css">
        <link rel="stylesheet" href="css/base.css">
    </head>
    <body>
        <a class="skip-link" href="#games">ゲーム一覧へスキップ</a>

        <header class="appbar">
            <div class="container appbar-row">
                <a class="brand" href="homepage.html" data-view-link="all">
                    <span class="brand-mark" aria-hidden="true">T</span>
                    <span class="brand-name" data-site-title>TEMのゲームサイト</span>
                </a>
                <button type="button" class="icon-btn" id="theme-toggle" aria-label="テーマを切り替え">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
            <div class="container">
                <form class="search" role="search" id="search-form">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input id="search" type="search" placeholder="ゲームをさがす" aria-label="ゲームをさがす" autocomplete="off" enterkeyhint="search">
                    <button type="button" class="search-clear" id="search-clear" aria-label="検索をクリア" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </form>
            </div>
        </header>

        <main id="main">
            <h1 class="visually-hidden" data-site-title>TEMのゲームサイト</h1>

            <div class="banner" id="error-banner" role="alert" hidden>
                <p id="error-text"></p>
                <button type="button" class="btn btn-sm btn-ghost" id="retry-btn">もう一度</button>
            </div>

            <!-- ホームだけに出すブロック -->
            <div id="home-only">
                <section class="container hero" id="hero" aria-label="ピックアップ"></section>

                <section class="container shelf" id="recent" aria-labelledby="recent-title" hidden>
                    <div class="section-head">
                        <h2 id="recent-title">つづきから遊ぶ</h2>
                        <button type="button" class="text-btn" data-view-link="recent">すべて見る</button>
                    </div>
                    <div class="shelf-row" id="recent-list"></div>
                </section>
            </div>

            <section class="container catalog" id="games" aria-labelledby="games-title" tabindex="-1">
                <div class="section-head">
                    <h2 id="games-title">ゲーム一覧</h2>
                    <p class="result-count" id="result-count" aria-live="polite"></p>
                </div>

                <div class="toolbar" id="toolbar">
                    <div class="chips" id="tag-chips" role="group" aria-label="タグでしぼりこみ"></div>
                    <label class="select" id="sort-wrap">
                        <span class="visually-hidden">ならびかえ</span>
                        <select id="sort">
                            <option value="new">新しい順</option>
                            <option value="popular">人気順</option>
                            <option value="name">名前順</option>
                        </select>
                    </label>
                    <button type="button" class="text-btn" id="clear-history" hidden>履歴を消す</button>
                </div>

                <div class="grid" id="grid" aria-busy="true"></div>

                <div class="empty" id="empty" hidden>
                    <p class="empty-icon" id="empty-icon" aria-hidden="true">🔍</p>
                    <p class="empty-title" id="empty-title">見つかりませんでした</p>
                    <p class="empty-text" id="empty-text">ことばやタグを変えてみてください。</p>
                    <button type="button" class="btn btn-ghost" id="empty-action">条件をリセット</button>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>&copy; <span id="year">2026</span> <span data-site-title>TEMのゲームサイト</span></p>
            </div>
        </footer>

        <!-- 下のタブ（片手で届く位置） -->
        <nav class="tabbar" aria-label="メインメニュー">
            <button type="button" class="tab" data-view="all" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                <span>ホーム</span>
            </button>
            <button type="button" class="tab" data-view="fav">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
                <span>お気に入り</span>
            </button>
            <button type="button" class="tab" data-view="recent">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span>履歴</span>
            </button>
            <button type="button" class="tab" id="random-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2"/><circle cx="15.5" cy="15.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg>
                <span>おまかせ</span>
            </button>
        </nav>

        <!-- ゲームの詳細（スマホでは下から出るシート） -->
        <dialog class="sheet" id="detail" aria-labelledby="detail-title"></dialog>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script src="js/api.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
