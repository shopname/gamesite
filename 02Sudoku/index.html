<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
        <title>数独 | TEMのゲームサイト</title>
        <link rel="icon" href="/00Home/icons/icon.svg" type="image/svg+xml">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Shippori Mincho B1 … 和の見出し・初期数字 / IBM Plex Mono … 入力した数字・計器の数字（ハイテク感） -->
        <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Sans+JP:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
        <!-- 読み込む順番に意味がある：共通の値 → 共通の見た目 → 数独だけの見た目（後に書いたものが優先される） -->
        <link rel="stylesheet" href="/00Home/css/tokens.css">
        <link rel="stylesheet" href="/00Home/css/gamekit.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <!-- data-game-id は game.json の id と C# の GameId と同じ文字にする（3か所そろえる） -->
    <body data-game-id="sudoku">
        <!-- 画面上部のバー（ホームへ戻る・タイトル・右端の gk-slot）は game.js の GameKit.init() が自動で作る -->
        <main class="gk-main sudoku" id="app" data-screen="select">

            <!-- ============================================================
                 難易度選択画面
                 ============================================================ -->
            <section class="screen screen-select" id="select-screen" aria-labelledby="select-title">
                <header class="hero">
                    <p class="hero-kicker" aria-hidden="true">SUDOKU <span>/ 17 · 19 · 21</span></p>
                    <h2 class="hero-title" id="select-title">難問を、ひとつ。</h2>
                    <p class="hero-sub">出題はすべて解がひとつだけの難問です。<br>入力はその場で答え合わせされ、3 回まちがえると終了します。</p>
                </header>

                <!-- 中断したゲームがあるときだけ表示する（game.js が hidden を外す） -->
                <button type="button" class="continue-card" id="continue" hidden>
                    <span class="continue-label">つづきから</span>
                    <span class="continue-meta" id="continue-meta"></span>
                    <span class="continue-bar" aria-hidden="true"><span id="continue-bar"></span></span>
                </button>

                <!-- デイリー問題：全員が同じ盤面を解く日替わり問題（日本時間 0:00 に切り替わる） -->
                <button type="button" class="daily-card" id="daily" data-mode="daily">
                    <span class="daily-kicker">今日の一題 <span class="daily-status" id="daily-status"></span></span>
                    <span class="daily-date" id="daily-date"></span>
                    <span class="daily-meta">極めて難しい ・ 初期数字 17 ・ 全員が同じ盤面</span>
                </button>

                <!-- 難易度。押すとすぐにその難易度で始まる -->
                <div class="mode-list" id="modes" role="group" aria-label="難易度を選んで始める">
                    <button type="button" class="mode-card" data-mode="hard">
                        <span class="mode-num" aria-hidden="true">壱</span>
                        <span class="mode-name">難しい</span>
                        <span class="mode-meta">初期数字 21 ・ ロックされた候補、ペア</span>
                    </button>
                    <button type="button" class="mode-card" data-mode="very_hard">
                        <span class="mode-num" aria-hidden="true">弐</span>
                        <span class="mode-name">とても難しい</span>
                        <span class="mode-meta">初期数字 19 ・ トリプル、X-Wing</span>
                    </button>
                    <button type="button" class="mode-card" data-mode="extreme">
                        <span class="mode-num" aria-hidden="true">参</span>
                        <span class="mode-name">極めて難しい</span>
                        <span class="mode-meta">初期数字 17 ・ 上級技法、仮置き</span>
                    </button>
                </div>

                <button type="button" class="text-btn" id="open-ranking">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
                    ランキングを見る
                </button>
            </section>

            <!-- ============================================================
                 プレイ画面
                 ============================================================ -->
            <section class="screen screen-play" id="play-screen" aria-label="プレイ" hidden>
                <div class="play-head">
                    <p class="play-mode" id="play-mode"></p>
                    <!-- 選択中のマスの座標（R = 行、C = 列）。見た目の演出なので読み上げない -->
                    <p class="play-coord" id="play-coord" aria-hidden="true">R– · C–</p>
                </div>

                <!-- 統計欄。「用語と説明」の組なので <dl> / <dt> / <dd> -->
                <dl class="gk-stats">
                    <div class="gk-stat" id="stat-mistakes"><dt>間違い</dt><dd><span id="mistakes">0</span><small>/3</small></dd></div>
                    <div class="gk-stat"><dt>進捗</dt><dd id="progress">0%</dd></div>
                    <div class="gk-stat"><dt>時間</dt><dd id="time">0:00</dd></div>
                </dl>
                <div class="progress-line" aria-hidden="true"><span id="progress-line"></span></div>

                <!-- 盤面。81 マスは game.js が作る。role="grid" で、矢印キーでマスを移動できる表として扱う -->
                <div class="board-wrap">
                    <div class="board" id="board" role="grid" aria-label="数独の盤面" aria-busy="true"></div>
                </div>

                <div class="tools">
                    <button type="button" class="tool" id="undo">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                        <span>元に戻す</span>
                    </button>
                    <button type="button" class="tool" id="erase">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4-4a2 2 0 0 1 0-2.8L13.2 4a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L11 20"/><path d="M22 21H7M5 11l9 9"/></svg>
                        <span>メモを消す</span>
                    </button>
                    <!-- 数字／メモの切替。状態は aria-pressed だけで持つ（ON = メモ入力） -->
                    <button type="button" class="tool tool-memo" id="memo" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        <span>メモ</span>
                        <span class="tool-state" id="memo-state" aria-hidden="true">OFF</span>
                    </button>
                </div>

                <!-- 現在の入力モードを文字でも明示する（仕様「現在のモードを明示する」） -->
                <p class="input-mode" id="input-mode" aria-live="polite">入力：<b>数字</b></p>

                <!-- 数字ボタン。小さい数字は残数（9 − 盤面にある個数）。残数 0 は確定入力できない -->
                <div class="number-picker" id="numpad" role="group" aria-label="数字を選択">
                    <button type="button" data-number="1"><span class="num">1</span><span class="left"></span></button>
                    <button type="button" data-number="2"><span class="num">2</span><span class="left"></span></button>
                    <button type="button" data-number="3"><span class="num">3</span><span class="left"></span></button>
                    <button type="button" data-number="4"><span class="num">4</span><span class="left"></span></button>
                    <button type="button" data-number="5"><span class="num">5</span><span class="left"></span></button>
                    <button type="button" data-number="6"><span class="num">6</span><span class="left"></span></button>
                    <button type="button" data-number="7"><span class="num">7</span><span class="left"></span></button>
                    <button type="button" data-number="8"><span class="num">8</span><span class="left"></span></button>
                    <button type="button" data-number="9"><span class="num">9</span><span class="left"></span></button>
                </div>

                <p class="keys-hint">
                    <kbd>1</kbd>〜<kbd>9</kbd> 入力 ・ <kbd>Shift</kbd>+数字 メモ ・ 矢印 移動 ・
                    <kbd>N</kbd> メモ切替 ・ <kbd>Z</kbd> 元に戻す ・ <kbd>Esc</kbd> 一時停止
                </p>
            </section>

            <!-- 画面読み上げ用のお知らせ（「5行3列に7を確定」など）。見た目には出さない -->
            <p class="sr-only" id="announcer" aria-live="polite"></p>
        </main>

        <!-- ============================================================
             ダイアログ（<dialog> は JS の showModal() で開くと、後ろの画面を触れなくする）
             ============================================================ -->

        <!-- 一時停止：時計を止め、盤面を隠す -->
        <dialog class="sd-dialog" id="pause-dialog" aria-labelledby="pause-dialog-title">
            <div class="sd-dialog-body">
                <p class="sd-dialog-kicker" aria-hidden="true">PAUSED</p>
                <h2 id="pause-dialog-title">一時停止</h2>
                <p class="pause-time" id="pause-time">0:00</p>
                <div class="pause-actions">
                    <button type="button" class="gk-btn gk-btn-primary gk-btn-block" id="resume">再開</button>
                    <button type="button" class="gk-btn gk-btn-block" id="reset">リセット（最初から）</button>
                    <button type="button" class="gk-btn gk-btn-block" id="retire">リタイア</button>
                </div>
                <label class="switch">
                    <input type="checkbox" id="reduce-motion">
                    <span>アニメーションを控えめにする</span>
                </label>
            </div>
        </dialog>

        <!-- 確認（リタイア・リセットなど取り消せない操作の前に出す）。急ぎの返事が要るので alertdialog -->
        <dialog class="sd-dialog" id="confirm-dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
            <div class="sd-dialog-body">
                <h2 id="confirm-title"></h2>
                <p id="confirm-desc"></p>
                <div class="confirm-actions">
                    <button type="button" class="gk-btn" id="confirm-cancel">やめる</button>
                    <button type="button" class="gk-btn gk-btn-primary" id="confirm-ok"></button>
                </div>
            </div>
        </dialog>

        <!-- ランキング：難易度ごと ＋ 今日のデイリー -->
        <dialog class="sd-dialog" id="ranking-dialog" aria-labelledby="ranking-title">
            <div class="sd-dialog-body">
                <h2 id="ranking-title">ランキング</h2>
                <div class="gk-segmented ranking-tabs" id="ranking-tabs" role="group" aria-label="ランキングの種類">
                    <button type="button" data-board="daily" aria-pressed="true">今日の一題</button>
                    <button type="button" data-board="hard" aria-pressed="false">難しい</button>
                    <button type="button" data-board="very_hard" aria-pressed="false">とても</button>
                    <button type="button" data-board="extreme" aria-pressed="false">極めて</button>
                </div>
                <div class="ranking-body" id="ranking-list" aria-live="polite"></div>
                <p class="ranking-rule">スコア ＝ 基礎点 ＋ 時間ボーナス − ミス × 500。各プレイヤーの自己ベストで順位を決め、同点は同順位です。</p>
                <button type="button" class="gk-btn gk-btn-block" id="ranking-close">閉じる</button>
            </div>
        </dialog>

        <!-- 読み込む順番に意味がある：api.js（通信）→ gamekit.js（api を使う）→ game.js（両方を使う） -->
        <script src="/00Home/js/api.js"></script>
        <script src="/00Home/js/gamekit.js"></script>
        <script src="game.js"></script>
    </body>
</html>
